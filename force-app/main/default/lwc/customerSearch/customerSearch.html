<template>
    <lightning-card title="Customer Search" icon-name="standard:account">
        <div class ="slds-p-around_medium">
            <lightning-input
                label="Search Customer"
                type = "search"
                placeholder="Enter Customer name ..."
                value={searchKey}
                onchange={handleSearchChange}>
            </lightning-input>

            <lightning-button 
                label = "Search"
                variant = "brand"
                onclick={handleSearch}
                class="slds-m-top_medium">
            </lightning-button>


            <lightning-button
                label="Clear"
                variant ="destructive"
                onclick={handleClear}
                class="slds-m-top_medium slds-m-left_small">
            </lightning-button>

            <template lwc:if={isLoading}>
                
                <lightning-spinner
                alternative-text="Searching Customers . . ."
                size = "medium"
                variant ="brand">
            </lightning-spinner>

            </template>

            <template lwc:if ={errorMessage}>
                <div class = "slds-text-color_error
                slds-m-top_medium" role = "alert">
            {errorMessage}
        </div>
            </template>

            <template lwc:if={customers}>
                <template for:each={customers} for:item="customer">
                    <div key={customer.Id}
                    class="customer-card">

                    <p class = "customer-name">
                        Customer : 
                        <lightning-button 
                        label = {customer.Name}
                        variant="base"
                        name={customer.Id}
                        onclick={handleViewCustomer}>
                        </lightning-button>
                    </p>

                    <p>
                <strong>Phone:</strong>{customer.Phone}
                    </p>

                    <p>
                <strong>Website:</strong>{customer.Website}
                    </p>

                    <lightning-button
                        label = "Edit Customer"
                        variant = "brand-outline"
                        data-id={customer.Id}
                        onclick={handleEditClick}>
                    </lightning-button>

                    <lightning-button
                    label="Delete Customers"
                    variant="destructive"
                    name={customer.Id}
                    onclick={handleDeleteClick}
                    class="slds-m-top_medium
                    slds-m-left_small">
                </lightning-button>

                    <p class="section-heading">
                     Contacts
                    </p>

                    <template
                    for:each = {customer.Contacts}
                    for:item ="contact">

                    <div 
                    key={contact.Id}
                    
                    class ="contact-details">

                        <p>Name:{contact.Name}</p>
                        <p>Email:{contact.Email}</p>
                        <p>Phone:{contact.Phone}</p>
                    </div>

                    </template>

                </div>
                </template>
            </template>

              <template lwc:if={selectedCustomerId}>

    <lightning-card
        title="Edit Customer"
        class="slds-m-top_medium">

        <div class="slds-p-around_medium">

            <lightning-record-edit-form
                object-api-name="Account"
                record-id={selectedCustomerId}
                onsuccess={handleEditSuccess}>

                <lightning-messages></lightning-messages>

                <lightning-input-field
                    field-name="Name">
                </lightning-input-field>

                <lightning-input-field
                    field-name="Phone">
                </lightning-input-field>

                <lightning-input-field
                    field-name="Website">
                </lightning-input-field>

                <lightning-button
                    type="submit"
                    label="Save Changes"
                    variant="brand">
                </lightning-button>

            </lightning-record-edit-form>

        </div>

    </lightning-card>

</template>
        </div>
    </lightning-card>
</template>
